<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كولشي كاين</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#02306c"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
<style>
:root{--bg:#f1f6fb;--card:#fff;--ink:#0d2147;--mut:#5b6b85;--pri:#02306c;--on:#fff;--acc:#ff6f10;--cta:#ff6f10;--line:#d6e0ee;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1428;--card:#13203d;--ink:#e8eefb;--mut:#9fb0cf;--pri:#7fb0ff;--on:#071126;--line:#24365c;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:25px;margin:0 0 4px;font-weight:800}h2{font-size:18px;margin:20px 0 8px}p{margin:0 0 10px;color:var(--mut)}
input,button{font:inherit}
input[type=text],input[type=number],input[type=password],input[type=search]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:8px}
input:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.btn{background:var(--cta);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn.sm{padding:6px 10px;font-size:14px}
.err{color:var(--bad);min-height:24px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.chip{padding:7px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.ico{font-size:30px;width:68px;height:68px;flex:none;display:grid;place-items:center;background:var(--bg);border-radius:10px;overflow:hidden}.ico img{width:100%;height:100%;object-fit:contain}
.info{flex:1;min-width:0}.name{font-weight:700}.price{color:var(--mut)}
.new{background:var(--acc);color:#2b1d00;font-size:12px;font-weight:800;padding:1px 8px;border-radius:99px;margin-inline-start:6px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--pri);background:transparent;color:var(--pri);font-size:20px;line-height:1;cursor:pointer}
.qty span{min-width:20px;text-align:center;font-weight:700}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.off{opacity:.55}
[hidden]{display:none!important}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;color:#fff;text-align:center}
#lb img{max-width:94vw;max-height:72vh;object-fit:contain;border-radius:12px;background:#fff}
#lb .n{font-size:20px;font-weight:800}#lb .x{opacity:.7;font-size:14px}
select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:8px;font:inherit}
.pos{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.side{flex:0 0 88px;position:sticky;top:8px;display:flex;flex-direction:column;gap:8px}
.cat{padding:12px 2px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:700;text-align:center;cursor:pointer;overflow-wrap:break-word}
.cat.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.grid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-width:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px}
.card.sel{border-color:var(--pri)}
.pic{position:relative;aspect-ratio:1;background:var(--bg);display:grid;place-items:center;font-size:40px;overflow:hidden;cursor:zoom-in}
.pic img{width:100%;height:100%;object-fit:contain}
.pb{position:absolute;top:4px;left:4px;background:var(--acc);color:#fff;font-size:12px;font-weight:800;padding:1px 7px;border-radius:5px}
.tag{position:absolute;bottom:4px;right:4px;background:var(--pri);color:var(--on);font-size:11px;font-weight:800;padding:0 7px;border-radius:99px}
.cn{font-weight:700;font-size:14px;line-height:1.35;text-align:center;min-height:2.7em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.add{background:transparent;color:var(--pri);border:1.5px solid var(--pri);border-radius:8px;padding:5px;font:inherit;font-weight:700;cursor:pointer}
.card .qty{justify-content:space-between}.card .qty button{width:30px;height:30px;font-size:18px}
.card .qty{gap:4px}.card .qty button{width:28px;height:28px;flex:none}
.qty input.qn{flex:1;min-width:0;width:auto;padding:4px 2px;margin:0;text-align:center;font-weight:700;border-radius:8px;-moz-appearance:textfield}
.qty input.qn::-webkit-outer-spin-button,.qty input.qn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#rc{position:fixed;inset:0;background:#fff;color:#000;z-index:60;overflow:auto;padding:12px}
#rc .bt{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.rcp{max-width:380px;margin:0 auto;font-size:15px;line-height:1.7}
.rcp .rt{font-size:22px;font-weight:800;text-align:center;text-decoration:underline;margin-bottom:6px}
.rcp table{width:100%;border-collapse:collapse;margin:10px 0}
.rcp th,.rcp td{border:1.5px solid #000;padding:4px 6px;text-align:center}
.rcp td.nm{text-align:right}
.rcp .tt{font-size:20px;font-weight:800;margin-top:8px}
@media print{body>*:not(#rc){display:none!important}#rc{position:static;overflow:visible;padding:0}.noprint{display:none!important}}
.ft{margin:26px -14px 0;background:#002d66;color:#fff;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.ft img.lk{height:40px;width:auto}
.ft .tg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.ft .tg img{height:30px;width:auto}
.btn:disabled{opacity:.6;cursor:default}
.bell{background:var(--acc);color:#fff;border-radius:99px;padding:0 8px;font-weight:800;font-size:13px}
.rv{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0}
.rl{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}.rl:last-child{border-bottom:0}
.rn{font-weight:700}.rq{color:var(--mut);white-space:nowrap}.rt2{font-weight:700;white-space:nowrap}
.rtot{display:flex;justify-content:space-between;align-items:center;font-size:20px;padding:6px 4px 10px}

main{padding-bottom:150px}
#er:empty{display:none}
.hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;background:#02306c;color:#fff;margin:-16px -14px 14px;padding:8px 10px 8px 14px}
.hd img{height:30px;width:auto}.hd b{font-size:18px;font-weight:800;flex:1}
.hd input[type=search]{margin:0;flex:1;border-color:transparent}
.ib{background:transparent;border:0;color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;font-size:20px}
.hd>:last-child{margin-inline-start:auto}.hd b+.ib{margin-inline-start:0}
.ib svg,.tb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ban{background:linear-gradient(135deg,#02306c,#0b57c4);color:#fff;border-radius:16px;padding:18px 16px;margin-bottom:6px;display:flex;flex-direction:column;gap:4px}
.ban b{font-size:20px}.ban span{opacity:.85}
.st{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;font-size:18px}.st a{font-size:14px;color:var(--acc);cursor:pointer;font-weight:700}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.hc{flex:0 0 150px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;scroll-snap-align:start}
.hc .pi{width:100%;height:104px}.hc .pn{font-size:14px;min-height:2.7em}.hc .pa{margin-top:auto}
.cg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ct{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font:inherit;cursor:pointer}
.ci{width:64px;height:64px;display:grid;place-items:center;font-size:30px;background:var(--bg);border-radius:12px;overflow:hidden;flex:none}.ci img{width:100%;height:100%;object-fit:contain}
.cl{font-weight:700;font-size:13px;line-height:1.3;text-align:center;min-height:2.6em;display:flex;align-items:center}
.chs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.cc{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--ink);font:inherit;font-size:12px;font-weight:700;cursor:pointer;text-align:center;line-height:1.25}
.cc .ci{width:56px;height:56px;border:2px solid transparent}.cc.on .ci{border-color:var(--acc)}.cc.on{color:var(--acc)}
.pr{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.pi{position:relative;flex:none;width:84px;height:84px;display:grid;place-items:center;font-size:34px;background:var(--bg);border-radius:10px;overflow:hidden;cursor:zoom-in}.pi img{width:100%;height:100%;object-fit:contain}
.pm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pp{font-size:20px;font-weight:800;color:var(--pri)}.pp small{font-size:12px;font-weight:700;color:var(--mut)}
.pn{font-weight:700;line-height:1.35}.pl{color:var(--mut);font-size:13px}
.pa{margin-top:6px}.pa .add{width:100%;background:var(--cta);color:#fff;border:0;border-radius:10px;padding:9px 8px;font-weight:700;cursor:pointer}
.pa .qty{justify-content:space-between;gap:6px}.pa .qty button{width:36px;height:36px;flex:none}
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tb{position:relative;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
.tb svg{stroke-width:1.9}.tb.on{color:var(--acc)}
.bg{position:absolute;top:0;inset-inline-start:calc(50% + 2px);background:var(--acc);color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.mini{position:fixed;inset-inline:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:29;max-width:536px;margin:0 auto;background:var(--cta);color:#fff;border:0;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font:inherit;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.em{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:36px 16px;color:var(--mut)}.em b{color:var(--ink);font-size:18px}.em svg{color:var(--pri);margin-bottom:6px}
.ml{display:flex;flex-direction:column;gap:10px}.ml a,.ml button{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);text-decoration:none;font:inherit;font-weight:700;cursor:pointer;width:100%}
</style>
</head>
<body>
<main id="app"></main>
<input id="chg" type="file" accept="image/*" hidden>
<div id="lb" data-a="closebig" hidden></div>
<div id="rc" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
const SB_URL="https://pvuapijsvkaasliyrqzp.supabase.co",SB_KEY="sb_publishable_jQMGDmkV33dBCDkx8sgaxw_TNLKTux5";
const VAPID_PUBLIC="BCqAnZ9rEmyK5i9gRaKlyw-kGDli1MutNp98beEJPXprBr8-bt8xl_CqgOAOGFdnR0oiOlmpSGMjdYzJ6mSR7FQ"; // مفتاح عام لإشعارات الطلبات (آمن للنشر)
const WHATSAPP="212707071109"; // رقم واتساب لاستقبال الطلبات (بصيغة دولية بدون + أو 0)
const sb=window.supabase?supabase.createClient(SB_URL,SB_KEY):null;
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let code=ls.g("code"),cat=null,cart={},flt="all",q="",msg="",tab="p",adm=null,curId=null;
const A={};

/* ---------- الزبون ---------- */
let sending=false,fails=0,lockUntil=0;
const norm=s=>String(s==null?"":s).toLowerCase().replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
const jget=k=>{try{return JSON.parse(ls.g(k)||"null")}catch(e){return null}};
const saveCart=()=>{const e=Object.entries(cart).filter(x=>x[1]>0);ls.s("cart:"+code,e.length?JSON.stringify(Object.fromEntries(e)):null)};
const money=n=>Math.round(n*100)/100;
async function load(){
  const{data,error}=await sb.rpc("get_catalog",{p_code:code});
  if(error){msg="تعذر الاتصال بالخادم";return loginView()}
  if(!data){ls.s("cart:"+code,null);ls.s("last:"+code,null);ls.s("code",null);code=null;msg="الرمز غير صحيح";return loginView()}
  cat=data;msg="";
  const ids=new Set(cat.products.map(p=>String(p.id))),sv=jget("cart:"+code)||{};
  cart=Object.fromEntries(Object.entries(sv).filter(e=>ids.has(e[0])&&e[1]>0));
  history.replaceState({v:view,cid:catId},"");
  shopView();
}
function loginView(){app.innerHTML=`<h1 style="margin:0 0 10px"><img src="logo.jpg" alt="كولشي كاين" style="display:block;width:230px;max-width:80%;margin:0 auto;background:#fff;border-radius:16px;padding:8px"></h1><p style="text-align:center">أدخل الرمز السري الخاص بك.</p><input id="c" type="password" inputmode="numeric" placeholder="الرمز السري" autocomplete="off"><div class="err">${esc(msg)}</div><button class="btn" data-a="login">دخول</button><div class="ft"><img class="lk" src="lockup-white.png" alt="كولشي كاين"><div class="tg"><img src="hs.png" alt="">معاً ... لنمو تجارتك</div></div>`}
A.login=async()=>{
  if(Date.now()<lockUntil){msg="محاولات كثيرة، انتظر دقيقة ثم أعد المحاولة.";return loginView()}
  const v=$("#c").value.trim();if(!v)return;code=v;ls.s("code",v);await load();
  if(code===null){fails++;if(fails>=5){lockUntil=Date.now()+60000;fails=0}}else fails=0;
};
A.logout=()=>{ls.s("cart:"+code,null);ls.s("code",null);code=null;cart={};q="";flt="all";view="home";catId=null;msg="";loginView()};
A.back=()=>{view="home";load()};
A.reload=()=>location.reload();
A.big=d=>{const p=cat.products.find(x=>x.id===d.id);if(!p)return;const b=$("#lb");
b.innerHTML=(p.image_url?`<img src="${esc(p.image_url)}" alt="">`:'<div style="font-size:120px">📦</div>')+`<div class="n">${esc(p.name)} — ${p.price} درهم</div><div class="x">اضغط في أي مكان للإغلاق</div>`;b.hidden=false};
A.closebig=()=>{$("#lb").hidden=true};
/* ---------- واجهة المتجر ---------- */
let view="home",catId=null,focusS=false;
const IC={home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
new:'<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>',
cart:'<svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>',
list:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
more:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>',
back:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>'};
const EMPTY=(t,sub)=>`<div class="em"><svg viewBox="0 0 64 64" width="88" height="88" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M8 22l24-12 24 12v24L32 58 8 46z"/><path d="M8 22l24 12 24-12M32 34v24"/></svg><b>${t}</b><span>${sub||""}</span></div>`;
const cnt=()=>Object.values(cart).reduce((s,v)=>s+(v>0?v:0),0);
const total=()=>money(cat.products.reduce((s,p)=>s+(cart[p.id]||0)*p.price,0));
const pic=p=>p.image_url?`<img src="${esc(p.image_url)}" alt="" loading="lazy">`:"📦";
const inCat=(p,cid)=>cid==="none"?!p.category_id:p.category_id===cid;
function cats(){const l=(cat.categories||[]).filter(c=>cat.products.some(p=>p.category_id===c.id));if(l.length&&cat.products.some(p=>!p.category_id))l.push({id:"none",name:"منتجات أخرى"});return l}
const cimg=c=>{const p=cat.products.find(x=>inCat(x,c.id)&&x.image_url);return p?`<img src="${esc(p.image_url)}" alt="" loading="lazy">`:"📦"};
function ctl(p){const n=cart[p.id]||0;return n?`<div class="qty"><button data-a="dec" data-id="${p.id}" aria-label="إنقاص">−</button><input class="qn" type="number" inputmode="numeric" min="0" max="500" value="${n}" data-id="${p.id}" aria-label="الكمية"><button data-a="inc" data-id="${p.id}" aria-label="زيادة">+</button></div>`:`<button class="add" data-a="inc" data-id="${p.id}">+ أضف للسلة</button>`}
function rowHtml(p,line){const n=cart[p.id]||0;return `<div class="pr" data-row="${p.id}"><div class="pi" data-a="big" data-id="${p.id}">${pic(p)}${p.is_new?'<span class="tag">جديد</span>':""}</div><div class="pm"><div class="pp">${p.price} <small>درهم</small></div><div class="pn">${esc(p.name)}</div>${line&&n?`<div class="pl">المجموع: ${money(n*p.price)} درهم</div>`:""}<div class="pa">${ctl(p)}</div></div></div>`}
const hcard=p=>`<div class="hc" data-row="${p.id}"><div class="pi" data-a="big" data-id="${p.id}">${pic(p)}</div><div class="pp">${p.price} <small>درهم</small></div><div class="pn">${esc(p.name)}</div><div class="pa">${ctl(p)}</div></div>`;
function barsHtml(){
  const n=cnt(),on=view==="cat"||view==="search"?"home":view;
  const mini=n&&view!=="cart"?`<button class="mini" data-a="nav" data-v="cart"><span>🛒 ${n} قطعة</span><b>${total()} درهم</b><span>عرض السلة ›</span></button>`:"";
  const tabs=[["home","الرئيسية","home"],["new","الجديد","new"],["cart","السلة","cart"],["orders","طلباتي","list"],["more","المزيد","more"]]
    .map(t=>`<button class="tb ${on===t[0]?"on":""}" data-a="nav" data-v="${t[0]}">${t[0]==="cart"&&n?`<i class="bg">${n}</i>`:""}${IC[t[2]]}<span>${t[1]}</span></button>`).join("");

const editCHtml=c=>`<div class="item"><div class="info"><input id="ecn" type="text" value="${esc(c.name)}" placeholder="اسم البقالة"><input id="ecp" type="text" inputmode="tel" value="${esc(c.phone||"")}" placeholder="رقم الهاتف"><input id="eca" type="text" value="${esc(c.address||"")}" placeholder="العنوان / الحي"><input id="ecnt" type="text" value="${esc(c.note||"")}" placeholder="ملاحظة"><div class="acts"><button class="btn sm" data-a="savec" data-id="${c.id}">حفظ</button><button class="btn alt sm" data-a="cancelc">إلغاء</button></div></div></div>`;
const b64u=t=>{const p="=".repeat((4-t.length%4)%4),r=atob((t+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0))};
const pushOk=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
let pushSynced=false;
async function pushState(){
  const b=$("#pushb");if(!b)return;
  if(!pushOk()){b.textContent="🔔 تفعيل الإشعارات";return}
  try{const reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription(),on=!!s&&Notification.permission==="granted";
    const b2=$("#pushb");if(b2)b2.textContent=on?"🔔 الإشعارات مفعّلة ✓":"🔔 تفعيل الإشعارات";
    if(on&&!pushSynced){pushSynced=true;const j=s.toJSON();await sb.from("push_subscriptions").upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:"endpoint"})}
  }catch(e){}
}
A.pushtog=async()=>{
  if(!pushOk()){msg="هذا المتصفح لا يدعم الإشعارات. على آيفون: ثبّت التطبيق أولا (زر المشاركة ← إضافة إلى الشاشة الرئيسية) ثم افتحه من الشاشة الرئيسية.";return adminView()}
  try{
    const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(sub){await sb.from("push_subscriptions").delete().eq("endpoint",sub.endpoint);await sub.unsubscribe();pushSynced=false;msg="";return adminView()}
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){msg="لم يُسمح بالإشعارات. فعّلها لهذا الموقع من إعدادات المتصفح ثم أعد المحاولة.";return adminView()}
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    const j=sub.toJSON(),{error}=await sb.from("push_subscriptions").upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:"endpoint"});
    if(error){await sub.unsubscribe();msg="تعذر حفظ الاشتراك (هل شغّلت setup-push.sql؟): "+error.message;return adminView()}
    pushSynced=true;msg="";adminView();
    reg.showNotification("✅ تم تفعيل الإشعارات",{body:"ستصلك إشعارات الطلبات الجديدة على هذا الجهاز",icon:"icon-192.png",dir:"rtl",lang:"ar"});
  }catch(e){msg="تعذر تفعيل الإشعارات: "+(e&&e.message?e.message:e);adminView()}
};
function adminView(){
  heldP=null;
  const tabs=[["p","المنتجات"],["c","الزبناء"],["o","الطلبات"+(unseen&&tab!=="o"?" ("+unseen+")":"")]].map(t=>`<button class="chip ${tab===t[0]?"on":""}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join("");
  let h="";
  if(tab==="p")h=`<h2>الأصناف</h2><div class="row"><input id="kn" type="text" placeholder="اسم صنف جديد"><div><button class="btn sm" data-a="addcat">إضافة صنف</button></div></div><div class="chips">${adm.k.map(k=>`<span class="chip">${esc(k.name)} <a data-a="delcat" data-id="${k.id}" style="cursor:pointer;color:var(--bad)">✕</a></span>`).join("")}</div><h2>إضافة منتج</h2><input id="pn" type="text" placeholder="اسم المنتج"><input id="pp" type="number" inputmode="decimal" placeholder="السعر بالدرهم"><select id="pcat"><option value="">بدون صنف</option>${adm.k.map(k=>`<option value="${k.id}">${esc(k.name)}</option>`).join("")}</select><input id="pf" type="file" accept="image/*"><div class="price" id="pfn"></div><label><input id="pnw" type="checkbox" checked> منتج جديد</label><div class="acts"><button class="btn sm" data-a="addp">إضافة</button></div>`+
    adm.p.map(p=>p.id===editId?`<div class="item"><div class="info"><input id="en" type="text" value="${esc(p.name)}" placeholder="اسم المنتج"><input id="ep" type="number" inputmode="decimal" value="${p.price}" placeholder="السعر بالدرهم"><div class="acts"><button class="btn sm" data-a="saveedit" data-id="${p.id}">حفظ</button><button class="btn alt sm" data-a="canceledit">إلغاء</button></div></div></div>`:`<div class="item ${p.active?"":"off"}"><div class="ico">${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:"📦"}</div><div class="info"><div class="name">${esc(p.name)}${p.is_new?'<span class="new">جديد</span>':""}</div><div class="price">${p.price} درهم${p.active?"":" — مخفي"}</div><select data-cs data-id="${p.id}" style="margin:6px 0 0"><option value="">بدون صنف</option>${adm.k.map(k=>`<option value="${k.id}" ${p.category_id===k.id?"selected":""}>${esc(k.name)}</option>`).join("")}</select><div class="acts"><button class="btn alt sm" data-a="edit" data-id="${p.id}">تعديل</button><button class="btn alt sm" data-a="imgp" data-id="${p.id}">صورة</button><button class="btn alt sm" data-a="tgnew" data-id="${p.id}">جديد/عادي</button><button class="btn alt sm" data-a="tgact" data-id="${p.id}">${p.active?"إخفاء":"إظهار"}</button><button class="btn alt sm" data-a="delp" data-id="${p.id}">حذف</button></div></div></div>`).join("");
  if(tab==="c")h=`<h2>إضافة زبون</h2><div class="row"><input id="cn" type="text" placeholder="اسم البقالة"><input id="cc" type="text" inputmode="numeric" placeholder="رمز (6 أرقام+)"></div><input id="cph" type="text" inputmode="tel" autocomplete="off" placeholder="رقم الهاتف (اختياري) مثال: 0612345678"><input id="cad" type="text" autocomplete="off" placeholder="العنوان / الحي (اختياري)"><input id="cnt" type="text" autocomplete="off" placeholder="ملاحظة (اختياري)"><div class="acts"><button class="btn sm" data-a="addc">إضافة</button></div>`+
    adm.c.map(c=>c.id===editCid?editCHtml(c):`<div class="item ${c.active?"":"off"}"><div class="info"><div class="name">${esc(c.name)}</div>${phoneHtml(c)}${infoHtml(c)}<div class="price">الرمز: <b>${esc(c.code)}</b>${c.active?"":" — موقوف"}</div><div class="acts"><button class="btn alt sm" data-a="editc" data-id="${c.id}">تعديل</button><button class="btn alt sm" data-a="codec" data-id="${c.id}">تغيير الرمز</button><button class="btn alt sm" data-a="tgc" data-id="${c.id}">${c.active?"إيقاف":"تفعيل"}</button><button class="btn alt sm" data-a="delc" data-id="${c.id}">حذف</button></div></div></div>`).join("");
  if(tab==="o"){const f=adm.o.filter(o=>ofl==="all"||(ofl==="done")===(o.status==="done")),nn=adm.o.filter(o=>o.status!=="done").length,ofb=`<div class="chips">${[["all","الكل"],["new","الجديدة ("+nn+")"],["done","المسلَّمة"]].map(x=>`<button class="chip ${ofl===x[0]?"on":""}" data-a="ofl" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>`;h=ofb+(f.map(o=>`<div class="item ${o.status==="done"?"off":""}"><div class="info"><div class="name">${esc(o.customers?o.customers.name:"—")} — ${o.total} درهم</div><div class="price">${new Date(o.created_at).toLocaleString("fr-FR")}</div><div>${o.items.map(l=>esc(l.name)+" × "+l.qty).join("<br>")}</div><div class="acts"><button class="btn alt sm" data-a="print" data-id="${o.id}">طباعة</button><button class="btn alt sm" data-a="doneo" data-id="${o.id}">${o.status==="done"?"إرجاع كجديد":"تم التسليم"}</button></div></div></div>`).join("")||"<p>لا توجد طلبات.</p>")}
  app.innerHTML=`<div class="top"><h1>لوحة المدير</h1><div class="acts"><button class="btn alt sm" data-a="toshop">المتجر</button><button class="btn alt sm" data-a="alogout">خروج</button></div></div><div style="margin:6px 0"><button class="btn alt sm" id="pushb" data-a="pushtog">🔔 الإشعارات</button></div><div class="chips">${tabs}</div><div class="err">${esc(msg)}</div>${h}`;pushState();
}

/* ---------- التشغيل ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.cs!==undefined)db(sb.from("products").update({category_id:t.value||null}).eq("id",t.dataset.id))});
document.addEventListener("change",e=>{const t=e.target;if(t.id!=="pf")return;const n=$("#pfn");n.textContent="جارٍ قراءة الصورة…";
  heldP=hold(t.files[0]).then(b=>{n.textContent=b?"✓ تم اختيار الصورة":"";return b},()=>{n.textContent="تعذر قراءة الصورة. التقط صورة جديدة أو اختر ملفا آخر.";return null})});
document.addEventListener("change",e=>{const t=e.target;if(t.classList&&t.classList.contains("qn")){let v=parseInt(t.value,10);if(!(v>0))v=0;cart[t.dataset.id]=Math.min(500,v);saveCart();upd(t.dataset.id)}});
document.addEventListener("input",e=>{if(e.target.id==="sq"){q=e.target.value;const l=$("#list");if(l)l.innerHTML=searchList()}});
window.addEventListener("popstate",e=>{if(!cat||location.hash==="#admin"||!code)return;const st=e.state;view=st&&st.v?st.v:"home";catId=st?st.cid||null:null;msg="";shopView()});
document.addEventListener("focusin",e=>{if(e.target.classList&&e.target.classList.contains("qn"))e.target.select()});
var taps=0,tt;
document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest("h1")&&location.hash!=="#admin"){taps++;clearTimeout(tt);tt=setTimeout(()=>{taps=0},2000);if(taps>=5){taps=0;location.hash="#admin"}}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(e.target.id==="c")A.login();if(e.target.id==="pw")A.alogin()});
function boot(){msg="";stopPoll();if(!sb){app.innerHTML=`<h1>لا يوجد اتصال</h1><p>تعذر تحميل التطبيق. تحقق من الإنترنت ثم أعد المحاولة.</p><button class="btn" data-a="reload">إعادة المحاولة</button>`;return}if(location.hash==="#admin")admin();else if(code)load();else loginView()}
window.addEventListener("hashchange",boot);
boot();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
